<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Forge — تعلم JavaScript من الصفر إلى الاحتراف</title>
    <style>
        /* ============================================
           JS FORGE — DESIGN SYSTEM & TOKENS
           ============================================ */
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Fira+Code:wght@400;500;600&display=swap');
        
        :root {
            --bg-void: #0b0f19;
            --bg-surface: #111827;
            --bg-elevated: #1f2937;
            --bg-glass: rgba(17, 24, 39, 0.75);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --neon-cyan: #22d3ee;
            --neon-blue: #3b82f6;
            --neon-purple: #a855f7;
            --neon-pink: #ec4899;
            --neon-green: #34d399;
            --neon-yellow: #fbbf24;
            --neon-red: #f87171;
            --accent-gradient: linear-gradient(135deg, #22d3ee 0%, #3b82f6 50%, #a855f7 100%);
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --border-subtle: rgba(255,255,255,0.06);
            --border-glow: rgba(34, 211, 238, 0.2);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.5);
            --shadow-glow-cyan: 0 0 30px rgba(34, 211, 238, 0.15);
            --shadow-glow-purple: 0 0 30px rgba(168, 85, 247, 0.15);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --font-body: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Fira Code', 'Courier New', monospace;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-void: #f8fafc;
            --bg-surface: #ffffff;
            --bg-elevated: #f1f5f9;
            --bg-glass: rgba(255, 255, 255, 0.8);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-subtle: rgba(0,0,0,0.08);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.08);
            --shadow-glow-cyan: 0 0 30px rgba(34, 211, 238, 0.25);
            --shadow-glow-purple: 0 0 30px rgba(168, 85, 247, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            background: var(--bg-void);
            color: var(--text-primary);
            line-height: 1.7;
            transition: var(--transition);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 3px; }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes neonPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(34,211,238,0.3); }
            50% { box-shadow: 0 0 40px rgba(34,211,238,0.6); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .anim-fadeInUp { animation: fadeInUp 0.6s ease-out forwards; }
        .anim-popIn { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .anim-shake { animation: shake 0.4s ease-in-out; }
        .anim-float { animation: float 4s ease-in-out infinite; }

        /* ============================================
           LAYOUT
           ============================================ */
        .app {
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: 64px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main";
            min-height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (max-width: 1024px) {
            .app { grid-template-columns: 1fr; grid-template-areas: "header" "main"; }
            .sidebar { display: none; position: fixed; top: 64px; left: 0; right: 0; bottom: 0; z-index: 90; background: var(--bg-surface); }
            .mobile-toggle { display: flex !important; }
        }

        /* ============================================
           HEADER — NEON BAR
           ============================================ */
        .header {
            grid-area: header;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 900;
            font-size: 1.4rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            letter-spacing: -0.5px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--accent-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
            -webkit-text-fill-color: white;
            box-shadow: var(--shadow-glow-cyan);
            animation: neonPulse 3s infinite;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .progress-pill {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.4rem 1rem;
            background: var(--bg-elevated);
            border-radius: 50px;
            border: 1px solid var(--border-subtle);
            font-size: 0.8rem;
        }

        .progress-pill-bar {
            width: 120px;
            height: 6px;
            background: var(--bg-void);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-pill-fill {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 3px;
            transition: width 0.8s ease;
            background-size: 200% 200%;
            animation: gradientFlow 3s ease infinite;
        }

        .progress-pill-text {
            font-weight: 800;
            color: var(--neon-cyan);
            min-width: 36px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-elevated);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: var(--transition);
        }

        .icon-btn:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: var(--shadow-glow-cyan);
            transform: translateY(-2px);
        }

        .mobile-toggle { display: none; }

        /* ============================================
           SIDEBAR — LEVELS NAV
           ============================================ */
        .sidebar {
            grid-area: sidebar;
            position: sticky;
            top: 64px;
            height: calc(100vh - 64px);
            overflow-y: auto;
            padding: 1.25rem;
            border-left: 1px solid var(--border-subtle);
            background: var(--bg-surface);
        }

        .sidebar-title {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 1rem;
            padding: 0 0.5rem;
        }

        .level-group { margin-bottom: 1.25rem; }

        .level-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.75rem;
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
        }

        .level-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }
        .level-basic .level-dot { color: var(--neon-green); background: var(--neon-green); }
        .level-mid .level-dot { color: var(--neon-yellow); background: var(--neon-yellow); }
        .level-pro .level-dot { color: var(--neon-pink); background: var(--neon-pink); }

        .lesson-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            margin: 0.2rem 0;
            border: none;
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: right;
            position: relative;
        }

        .lesson-btn::before {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: var(--accent-gradient);
            border-radius: 2px;
            transition: height 0.3s ease;
        }

        .lesson-btn:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .lesson-btn:hover::before { height: 60%; }

        .lesson-btn.active {
            background: linear-gradient(90deg, rgba(34,211,238,0.1), rgba(168,85,247,0.1));
            color: var(--neon-cyan);
            border: 1px solid var(--border-glow);
        }

        .lesson-btn.active::before { height: 80%; }

        .lesson-btn.completed { color: var(--neon-green); }
        .lesson-btn.completed .lesson-check {
            background: var(--neon-green);
            color: var(--bg-void);
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
        }

        .lesson-check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .lesson-btn.active .lesson-check {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        /* ============================================
           MAIN CONTENT
           ============================================ */
        .main {
            grid-area: main;
            padding: 2rem;
            overflow-y: auto;
            height: calc(100vh - 64px);
        }

        .content-wrap {
            max-width: 880px;
            margin: 0 auto;
        }

        /* Hero */
        .lesson-hero {
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.5s ease-out;
        }

        .lesson-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .tag {
            padding: 0.3rem 0.9rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .tag-basic { background: rgba(52,211,153,0.15); color: var(--neon-green); border: 1px solid rgba(52,211,153,0.3); }
        .tag-mid { background: rgba(251,191,36,0.15); color: var(--neon-yellow); border: 1px solid rgba(251,191,36,0.3); }
        .tag-pro { background: rgba(236,72,153,0.15); color: var(--neon-pink); border: 1px solid rgba(236,72,153,0.3); }

        .lesson-count {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .lesson-title {
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 0.75rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: gradientFlow 6s ease infinite;
        }

        .lesson-desc {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
        }

        /* Cards */
        .card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.5s ease-out forwards;
            animation-fill-mode: both;
        }

        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }

        .card-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-primary);
        }

        .card-title-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: white;
            flex-shrink: 0;
        }

        .card-body {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.9;
        }

        .card-body p { margin-bottom: 1rem; }

        .hl {
            background: linear-gradient(120deg, rgba(34,211,238,0.15), rgba(168,85,247,0.15));
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
            font-weight: 700;
            color: var(--neon-cyan);
            border: 1px solid var(--border-glow);
            font-family: var(--font-mono);
            font-size: 0.9em;
        }

        /* Info blocks */
        .info-block {
            background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(168,85,247,0.08));
            border-right: 3px solid var(--neon-blue);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            margin: 1.25rem 0;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .info-block-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .info-block-content {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .info-block-content strong {
            color: var(--text-primary);
            display: block;
            margin-bottom: 0.3rem;
        }

        .tip-block {
            background: linear-gradient(135deg, rgba(52,211,153,0.08), rgba(52,211,153,0.04));
            border: 1px solid rgba(52,211,153,0.3);
            border-radius: var(--radius-md);
            padding: 1rem 1.25rem;
            margin: 1.25rem 0;
            font-size: 0.95rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .tip-block::before {
            content: '💡';
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        /* Code blocks */
        .code-wrap {
            position: relative;
            margin: 1.25rem 0;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #0d1117;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .code-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1rem;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .code-lang-badge {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: var(--font-mono);
        }

        .code-copy {
            padding: 0.3rem 0.7rem;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-weight: 600;
        }

        .code-copy:hover {
            background: var(--neon-cyan);
            color: var(--bg-void);
            border-color: var(--neon-cyan);
        }

        .code-block {
            padding: 1.25rem;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 0.88rem;
            line-height: 1.7;
            color: #e2e8f0;
        }

        .code-block .kw { color: #c084fc; font-weight: 600; } /* keyword */
        .code-block .fn { color: #60a5fa; } /* function */
        .code-block .str { color: #34d399; } /* string */
        .code-block .num { color: #fbbf24; } /* number */
        .code-block .cm { color: #6b7280; font-style: italic; } /* comment */
        .code-block .var { color: #f87171; } /* variable */

        /* ============================================
           JS PLAYGROUND — THE HEART
           ============================================ */
        .playground {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin: 1.5rem 0;
            min-height: 420px;
        }

        @media (max-width: 768px) {
            .playground { grid-template-columns: 1fr; }
        }

        .pg-panel {
            display: flex;
            flex-direction: column;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            background: var(--bg-surface);
            box-shadow: var(--shadow-md);
        }

        .pg-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border-subtle);
            font-weight: 800;
            font-size: 0.85rem;
        }

        .pg-head-left { display: flex; align-items: center; gap: 0.5rem; }

        .pg-actions { display: flex; gap: 0.5rem; }

        .pg-btn {
            padding: 0.35rem 0.8rem;
            border: 1px solid var(--border-subtle);
            background: var(--bg-surface);
            color: var(--text-secondary);
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .pg-btn:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .pg-btn.run {
            background: var(--accent-gradient);
            color: white;
            border: none;
            box-shadow: var(--shadow-glow-cyan);
        }

        .pg-btn.run:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(34, 211, 238, 0.3);
        }

        .code-editor {
            flex: 1;
            width: 100%;
            padding: 1.25rem;
            border: none;
            resize: none;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.7;
            background: #0d1117;
            color: #e2e8f0;
            outline: none;
            tab-size: 2;
            min-height: 200px;
        }

        .console-panel {
            background: #0a0e1a;
            border-top: 2px solid var(--border-subtle);
        }

        .console-head {
            padding: 0.6rem 1.25rem;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .console-body {
            flex: 1;
            padding: 1rem 1.25rem;
            font-family: var(--font-mono);
            font-size: 0.88rem;
            line-height: 1.7;
            color: var(--text-secondary);
            overflow-y: auto;
            max-height: 250px;
            min-height: 150px;
        }

        .console-line {
            padding: 0.25rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .console-line.error { color: var(--neon-red); }
        .console-line.warn { color: var(--neon-yellow); }
        .console-line.success { color: var(--neon-green); }

        .console-empty {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            padding: 2rem;
        }

        /* ============================================
           CODING CHALLENGE — INTERACTIVE
           ============================================ */
        .challenge-wrap {
            background: linear-gradient(135deg, rgba(34,211,238,0.08), rgba(168,85,247,0.08));
            border: 2px solid var(--border-glow);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            margin: 2rem 0;
            position: relative;
            overflow: hidden;
        }

        .challenge-wrap::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
        }

        .challenge-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .challenge-badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            background: var(--accent-gradient);
            color: white;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 800;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-glow-cyan);
        }

        .challenge-title {

                transparent 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px

            }
        }

        // ============================================
        // QUIZ
        // ============================================
        function selectQuiz(index) {
            if (quizAnswered) return;
            const lesson = lessons[currentIdx];
            const options = document.querySelectorAll('.quiz-option');
            const result = document.getElementById('quizResult');
            const isCorrect = index === lesson.quiz.correct;

            quizAnswered = true;
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === lesson.quiz.correct) {
                    opt.classList.add('correct');
                } else if (i === index && !isCorrect) {
                    opt.classList.add('wrong');
                }
            });

            result.classList.add('show');
            if (isCorrect) {
                result.className = 'quiz-result show ok';
                result.innerHTML = '🎯 إجابة صحيحة! فهم عميق.';
                createConfetti();
                markLessonComplete(currentIdx);
            } else {
                result.className = 'quiz-result show no';
                result.innerHTML = '❌ إجابة خاطئة. راجع الدرس ثم عُد.';
            }
        }

        // ============================================
        // PROGRESS
        // ============================================
        function markLessonComplete(index) {
            if (!completed.includes(index)) {
                completed.push(index);
                localStorage.setItem('jsForgeProgress', JSON.stringify(completed));
                updateSidebar();
                updateProgress();
            }
        }

        function updateSidebar() {
            document.querySelectorAll('.lesson-btn').forEach((btn, i) => {
                const check = btn.querySelector('.lesson-check');
                btn.classList.remove('completed');
                if (completed.includes(i)) {
                    btn.classList.add('completed');
                    check.textContent = '✓';
                } else {
                    check.textContent = '○';
                }
            });
        }

        function updateProgress() {
            const pct = Math.round((completed.length / lessons.length) * 100);
            const bar = document.getElementById('globalProgressBar');
            const txt = document.getElementById('globalProgressText');
            if (bar) bar.style.width = pct + '%';
            if (txt) txt.textContent = pct + '%';

            // Update final stats if on last lesson
            const finalQuiz = document.getElementById('finalQuiz');
            const finalChal = document.getElementById('finalChal');
            if (finalQuiz) finalQuiz.textContent = completed.length;
            if (finalChal) finalChal.textContent = solvedChallenges.length;
        }

        function resetProgress() {
            if (confirm('هل أنت متأكد من حذف جميع بيانات التقدم؟')) {
                completed = [];
                solvedChallenges = [];
                localStorage.removeItem('jsForgeProgress');
                localStorage.removeItem('jsForgeChallenges');
                updateSidebar();
                updateProgress();
                showToast('تم إعادة ضبط التقدم');
                loadLesson(0);
            }
        }

        // ============================================
        // NAVIGATION
        // ============================================
        function nextLesson() {
            if (currentIdx < lessons.length - 1) loadLesson(currentIdx + 1);
        }
        function prevLesson() {
            if (currentIdx > 0) loadLesson(currentIdx - 1);
        }
        function goHome() { loadLesson(0); }
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.style.display = sb.style.display === 'block' ? 'none' : 'block';
        }

        // ============================================
        // UTILITIES
        // ============================================
        function copyCode(btn) {
            const block = btn.closest('.code-wrap').querySelector('.code-block');
            navigator.clipboard.writeText(block.innerText).then(() => {
                const orig = btn.textContent;
                btn.textContent = '✓ تم!';
                setTimeout(() => btn.textContent = orig, 2000);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function createConfetti() {
            const colors = ['#22d3ee', '#a855f7', '#34d399', '#fbbf24', '#f87171'];
            for (let i = 0; i < 50; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.width = (Math.random() * 8 + 4) + 'px';
                c.style.height = (Math.random() * 8 + 4) + 'px';
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                c.style.animation = `confettiFall ${Math.random() * 2 + 2}s ease-out forwards`;
                c.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 4000);
            }
        }

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'TEXTAREA' && e.key === 'Tab') {
                e.preventDefault();
                const t = e.target;
                const s = t.selectionStart;
                t.value = t.value.slice(0, s) + '    ' + t.value.slice(t.selectionEnd);
                t.selectionStart = t.selectionEnd = s + 4;
            }
            if (e.ctrlKey && e.key === 'Enter') {
                if (document.activeElement && document.activeElement.id === 'jsEditor') {
                    runCode();
                } else if (document.activeElement && document.activeElement.id === 'challengeEditor') {
                    runChallenge();
                }
            }
        });

        // ============================================
        // START
        // ============================================
        init();
    </script>
</body>
</html>
