<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Master — من الصفر إلى الاحتراف</title>
    <style>
        /* ============================================
           CSS MASTER - DESIGN SYSTEM
           ============================================ */
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');
        
        :root {
            /* Light Theme */
            --bg-primary: #f0f4f8;
            --bg-secondary: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            --accent-primary: #667eea;
            --accent-secondary: #764ba2;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-glow: rgba(102, 126, 234, 0.3);
            --success: #48bb78;
            --warning: #ed8936;
            --danger: #f56565;
            --border: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
            --shadow-glow: 0 0 40px var(--accent-glow);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-glass: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent-primary: #818cf8;
            --accent-secondary: #c084fc;
            --accent-gradient: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            --accent-glow: rgba(129, 140, 248, 0.3);
            --border: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.3);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            transition: var(--transition);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        @keyframes blob {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        }

        .animate-fadeInUp { animation: fadeInUp 0.6s ease-out forwards; }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slideInRight { animation: slideInRight 0.5s ease-out forwards; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-pulse { animation: pulse 2s ease-in-out infinite; }

        /* ============================================
           GLASSMORPHISM COMPONENTS
           ============================================ */
        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        .glass-strong {
            background: var(--bg-glass);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: var(--shadow-lg);
        }

        /* ============================================
           LAYOUT
           ============================================ */
        .app-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            grid-template-rows: 70px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main";
            min-height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (max-width: 1024px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "main";
            }
            .sidebar {
                display: none;
            }
            .mobile-nav {
                display: flex !important;
            }
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            grid-area: header;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 900;
            font-size: 1.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-gradient);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            -webkit-text-fill-color: white;
            box-shadow: var(--shadow-glow);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .progress-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
        }

        .progress-header-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .progress-header-bar {
            width: 150px;
            height: 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-header-fill {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 4px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
        }

        .progress-header-text {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--accent-primary);
            min-width: 40px;
            text-align: left;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: var(--transition);
        }

        .btn-icon:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
            transform: rotate(15deg) scale(1.1);
            box-shadow: var(--shadow-glow);
        }

        /* ============================================
           SIDEBAR
           ============================================ */
        .sidebar {
            grid-area: sidebar;
            position: sticky;
            top: 70px;
            height: calc(100vh - 70px);
            overflow-y: auto;
            padding: 1.5rem;
            border-left: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 1rem;
            padding: 0 0.5rem;
        }

        .level-group {
            margin-bottom: 1.5rem;
        }

        .level-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem;
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .level-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        .level-beginner .level-badge { background: #c6f6d5; color: #22543d; }
        .level-intermediate .level-badge { background: #feebc8; color: #7c2d12; }
        .level-advanced .level-badge { background: #e9d8fd; color: #553c9a; }

        .lesson-nav-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 1rem;
            margin: 0.25rem 0;
            border: none;
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: right;
            position: relative;
            overflow: hidden;
        }

        .lesson-nav-btn::before {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: var(--accent-gradient);
            border-radius: 2px;
            transition: height 0.3s ease;
        }

        .lesson-nav-btn:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .lesson-nav-btn:hover::before {
            height: 60%;
        }

        .lesson-nav-btn.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: var(--shadow-glow);
        }

        .lesson-nav-btn.active::before {
            height: 80%;
        }

        .lesson-nav-btn.completed {
            color: var(--success);
        }

        .lesson-nav-btn.completed .lesson-status-icon {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .lesson-status-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .lesson-nav-btn.active .lesson-status-icon {
            border-color: rgba(255,255,255,0.5);
            color: white;
        }

        /* ============================================
           MAIN CONTENT
           ============================================ */
        .main-content {
            grid-area: main;
            padding: 2rem;
            overflow-y: auto;
            height: calc(100vh - 70px);
        }

        .content-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Hero Section */
        .lesson-hero {
            margin-bottom: 3rem;
            animation: fadeInUp 0.6s ease-out;
        }

        .lesson-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .lesson-level-tag {
            padding: 0.35rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag-beginner { background: #c6f6d5; color: #22543d; }
        .tag-intermediate { background: #feebc8; color: #7c2d12; }
        .tag-advanced { background: #e9d8fd; color: #553c9a; }

        .lesson-number {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .lesson-title {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 1rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .lesson-desc {
            font-size: 1.15rem;
            color: var(--text-secondary);
            max-width: 600px;
        }

        /* Content Sections */
        .section-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
        }

        .section-card:nth-child(2) { animation-delay: 0.1s; }
        .section-card:nth-child(3) { animation-delay: 0.2s; }
        .section-card:nth-child(4) { animation-delay: 0.3s; }

        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-primary);
        }

        .section-title-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--accent-gradient);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .section-body {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.9;
        }

        .section-body p {
            margin-bottom: 1rem;
        }

        .highlight-term {
            background: linear-gradient(120deg, var(--accent-glow) 0%, rgba(118, 75, 162, 0.2) 100%);
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
            font-weight: 700;
            color: var(--accent-primary);
            border: 1px solid var(--accent-glow);
        }

        /* Code Blocks */
        .code-block-wrapper {
            position: relative;
            margin: 1.5rem 0;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .code-lang {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .code-copy-btn {
            padding: 0.35rem 0.75rem;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: var(--text-secondary);
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .code-copy-btn:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .code-block {
            padding: 1.5rem;
            overflow-x: auto;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #e2e8f0;
        }

        .code-block .selector { color: #f472b6; }
        .code-block .property { color: #93c5fd; }
        .code-block .value { color: #86efac; }
        .code-block .punctuation { color: #94a3b8; }
        .code-block .comment { color: #64748b; font-style: italic; }

        /* ============================================
           INTERACTIVE PLAYGROUND
           ============================================ */
        .playground-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin: 2rem 0;
            min-height: 450px;
        }

        @media (max-width: 768px) {
            .playground-container {
                grid-template-columns: 1fr;
            }
        }

        .playground-panel {
            display: flex;
            flex-direction: column;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            box-shadow: var(--shadow-md);
        }

        .playground-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .playground-panel-header-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-actions {
            display: flex;
            gap: 0.5rem;
        }

        .panel-btn {
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .panel-btn:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .panel-btn.primary {
            background: var(--accent-gradient);
            color: white;
            border: none;
        }

        .panel-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .code-textarea {
            flex: 1;
            width: 100%;
            padding: 1.25rem;
            border: none;
            resize: none;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.7;
            background: #0f172a;
            color: #e2e8f0;
            outline: none;
            tab-size: 2;
        }

        .preview-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: white;
            min-height: 300px;
        }

        .preview-hint {
            padding: 0.75rem 1.25rem;
            background: var(--bg-primary);
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* ============================================
           QUIZ SYSTEM
           ============================================ */
        .quiz-wrapper {
            background: var(--accent-gradient);
            border-radius: var(--radius-lg);
            padding: 3px;
            margin: 2rem 0;
            box-shadow: var(--shadow-glow);
        }

        .quiz-inner {
            background: var(--bg-secondary);
            border-radius: calc(var(--radius-lg) - 3px);
            padding: 2.5rem;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .quiz-icon {
            width: 60px;
            height: 60px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1rem;
            box-shadow: var(--shadow-glow);
            animation: float 3s ease-in-out infinite;
        }

        .quiz-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-primary);
        }

        .quiz-subtitle {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .quiz-question-text {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            text-align: center;
        }

        .quiz-options-grid {
            display: grid;
            gap: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .quiz-option-card {
            padding: 1.25rem 1.5rem;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .quiz-option-card:hover {
            border-color: var(--accent-primary);
            transform: translateX(-8px);
            box-shadow: var(--shadow-md);
        }

        .quiz-option-card.selected {
            border-color: var(--accent-primary);
            background: rgba(102, 126, 234, 0.1);
        }

        .quiz-option-card.correct {
            border-color: var(--success);
            background: rgba(72, 187, 120, 0.1);
            color: var(--success);
        }

        .quiz-option-card.wrong {
            border-color: var(--danger);
            background: rgba(245, 101, 101, 0.1);
            color: var(--danger);
        }

        .quiz-option-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .quiz-option-card.selected .quiz-option-letter {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .quiz-result-box {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 800;
            font-size: 1.1rem;
            display: none;
        }

        .quiz-result-box.show {
            display: block;
            animation: fadeInUp 0.5s ease-out;
        }

        .quiz-result-box.success {
            background: rgba(72, 187, 120, 0.15);
            color: var(--success);
            border: 2px solid var(--success);
        }

        .quiz-result-box.error {
            background: rgba(245, 101, 101, 0.15);
            color: var(--danger);
            border: 2px solid var(--danger);
        }

}

.flip {

    transform-style: preserve-3d;
}

@keyframes bounce {

    50% { transform: scale(1.1); opacity: 0.8; }

@keyframes spin {

    to { transform: rotate(360deg); }

                html: `<div class="bem-demo">
    <div class="product-card">
        <div class="product-card__badge">جديد</div>
        <div class="product-card__image"></div>
        <div class="product-card__content">
            <h3 class="product-card__title">سماعات لاسلكية</h3>
            <p class="product-card__price">299 ريال</p>
            <button class="product-card__btn product-card__btn--primary">أضف للسلة</button>
        </div>
    </div>
    <div class="product-card product-card--featured">
        <div class="product-card__badge product-card__badge--hot">الأكثر مبيعاً</div>
        <div class="product-card__image product-card__image--featured"></div>
        <div class="product-card__content">
            <h3 class="product-card__title">لابتوب احترافي</h3>
            <p class="product-card__price product-card__price--sale">
                <span class="product-card__price-old">5000</span>
                3999 ريال
            </p>
            <button class="product-card__btn product-card__btn--secondary">اشتر الآن</button>

</div>`,
                css: `* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Tajawal', sans-serif;
    background: #f0f4f8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.bem-demo {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 40px;
}

/* Block: product-card */
.product-card {
    width: 280px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    position: relative;
    transition: transform 0.3s;
}

.product-card:hover { transform: translateY(-5px); }

/* Modifier: featured */
.product-card--featured {
    border: 3px solid #f093fb;
    box-shadow: 0 10px 30px rgba(240, 147, 251, 0.2);
}

/* Element: badge */
.product-card__badge {
    position: absolute;
    top: 15px;
    right: 15px;
    background: #48bb78;
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 700;
    z-index: 2;
}

.product-card__badge--hot {
    background: #f56565;
}

/* Element: image */
.product-card__image {
    height: 180px;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.product-card__image--featured {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    height: 200px;
}

/* Element: content */
.product-card__content {
    padding: 20px;
}

/* Element: title */
.product-card__title {
    font-size: 1.2rem;
    font-weight: 800;
    color: #1a202c;
    margin-bottom: 8px;
}

/* Element: price */
.product-card__price {
    font-size: 1.4rem;
    font-weight: 900;
    color: #667eea;
    margin-bottom: 15px;
}

.product-card__price--sale {
    color: #f56565;
}

.product-card__price-old {
    text-decoration: line-through;
    color: #a0aec0;
    font-size: 1rem;
    margin-left: 8px;
}

/* Element: button */
.product-card__btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
}

.product-card__btn--primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}

.product-card__btn--primary:hover {
    box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
}

.product-card__btn--secondary {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: white;
}

.product-card__btn--secondary:hover {
    box-shadow: 0 5px 20px rgba(240, 147, 251, 0.4);
}`,
                quiz: {
                    question: 'في BEM، ما الذي يُمثّله العنصر (Element)؟',
                    options: [
                        'حالة مختلفة للمكون',
                        'جزء لا يتجزأ من المكون (Block)',
                        'مكون مستقل بذاته',
                        'تعديل على التصميم'
                    ],
                    correct: 1
                }
            }
        ];

        // ============================================
        // STATE MANAGEMENT
        // ============================================
        let currentLessonIndex = 0;
        let completedLessons = JSON.parse(localStorage.getItem('cssMasterProgress') || '[]');
        let quizAnswered = false;
        let currentTheme = localStorage.getItem('cssMasterTheme') || 'light';

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            updateSidebar();
            updateGlobalProgress();
            loadLesson(0);
        }

        // ============================================
        // THEME
        // ============================================
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            
            if (isDark) {
                html.removeAttribute('data-theme');
                currentTheme = 'light';
            } else {
                html.setAttribute('data-theme', 'dark');
                currentTheme = 'dark';
            }
            localStorage.setItem('cssMasterTheme', currentTheme);
        }

        // ============================================
        // LESSON LOADING
        // ============================================
        function loadLesson(index) {
            currentLessonIndex = index;
            closeSidebar();
            const lesson = courseData[index];
            const mainContent = document.getElementById('mainContent');
            quizAnswered = false;

            // Update sidebar
            document.querySelectorAll('.lesson-nav-btn').forEach((btn, i) => {
                btn.classList.remove('active');
                if (i === index) btn.classList.add('active');
            });

            // Build lesson HTML
            let html = lesson.content;

            // Add Playground
            html += `
                <div class="section-card">
                    <h2 class="section-title">
                        <span class="section-title-icon">🔥</span>
                        بيئة التطوير التفاعلية
                    </h2>
                    <div class="section-body">
                        <p>عدّل كود CSS في المحرر وشاهد التغييرات مباشرة:</p>
                    </div>
                    <div class="playground-container">
                        <div class="playground-panel">
                            <div class="playground-panel-header">
                                <div class="playground-panel-header-left">
                                    <span>👁️</span>
                                    <span>المعاينة المباشرة</span>
                                </div>
                            </div>
                            <iframe class="preview-frame" id="previewFrame"></iframe>
                            <div class="preview-hint">المعاينة تتحدث تلقائياً عند الكتابة</div>
                        </div>
                        <div class="playground-panel">
                            <div class="playground-panel-header">
                                <div class="playground-panel-header-left">
                                    <span>🎨</span>
                                    <span>CSS</span>
                                </div>
                                <div class="panel-actions">
                                    <button class="panel-btn" onclick="resetPlayground()">إعادة</button>
                                    <button class="panel-btn primary" onclick="runPlayground()">▶ تشغيل</button>
                                </div>
                            </div>
                            <textarea class="code-textarea" id="cssEditor" spellcheck="false" placeholder="اكتب كود CSS هنا...">${lesson.css}</textarea>
                            <div class="playground-panel-header" style="border-top: 1px solid var(--border);">
                                <div class="playground-panel-header-left">
                                    <span>📄</span>
                                    <span>HTML</span>
                                </div>
                            </div>
                            <textarea class="code-textarea" id="htmlEditor" spellcheck="false" placeholder="اكتب كود HTML هنا..." style="min-height: 150px;">${lesson.html}</textarea>
                        </div>
                    </div>
                </div>
            `;

            // Add Quiz
            html += `
                <div class="quiz-wrapper">
                    <div class="quiz-inner">
                        <div class="quiz-header">
                            <div class="quiz-icon">🧠</div>
                            <div class="quiz-title">اختبار سريع</div>
                            <div class="quiz-subtitle">اختبر فهمك قبل الانتقال للدرس التالي</div>
                        </div>
                        <div class="quiz-question-text">${lesson.quiz.question}</div>
                        <div class="quiz-options-grid" id="quizOptions">
                            ${lesson.quiz.options.map((opt, i) => `
                                <div class="quiz-option-card" onclick="selectQuizAnswer(${i})" data-index="${i}">
                                    <span class="quiz-option-letter">${['أ', 'ب', 'ج', 'د'][i]}</span>
                                    <span>${opt}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="quiz-result-box" id="quizResult"></div>
                    </div>
                </div>
            `;

            // Add Navigation
            const isFirst = index === 0;
            const isLast = index === courseData.length - 1;
            
            html += `
                <div class="lesson-footer">
                    <button class="nav-btn" onclick="prevLesson()" ${isFirst ? 'disabled' : ''}>
                        <span>←</span>
                        <span>السابق</span>
                    </button>
                    <button class="nav-btn nav-btn-primary" onclick="nextLesson()" ${isLast ? 'disabled' : ''}>
                        <span>التالي</span>
                        <span>→</span>
                    </button>
                </div>
            `;

            mainContent.innerHTML = html;
            
            // Run playground
            setTimeout(() => runPlayground(), 100);
            
            // Scroll to top
            mainContent.scrollTop = 0;
        }

        // ============================================
        // PLAYGROUND
        // ============================================
        function runPlayground() {
            const html = document.getElementById('htmlEditor').value;
            const css = document.getElementById('cssEditor').value;
            const frame = document.getElementById('previewFrame');
            
            if (!frame) return;
            
            const doc = frame.contentDocument || frame.contentWindow.document;
            const content = `
                <!DOCTYPE html>
                <html dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <style>
                        ${css}
                    </style>
                </head>
                <body>
                    ${html}
                </body>
                </html>
            `;
            
            doc.open();
            doc.write(content);
            doc.close();
        }

        function resetPlayground() {
            const lesson = courseData[currentLessonIndex];
            document.getElementById('cssEditor').value = lesson.css;
            document.getElementById('htmlEditor').value = lesson.html;
            runPlayground();
            showToast('تمت إعادة الكود إلى حالته الأصلية');
        }

        // Auto-run on input
        document.addEventListener('input', (e) => {
            if (e.target.id === 'cssEditor' || e.target.id === 'htmlEditor') {
                clearTimeout(window.playgroundTimeout);
                window.playgroundTimeout = setTimeout(runPlayground, 500);
            }
        });

        // Tab support
        document.addEventListener('keydown', (e) => {
            if (e.target.classList.contains('code-textarea') && e.key === 'Tab') {
                e.preventDefault();
                const start = e.target.selectionStart;
                const end = e.target.selectionEnd;
                e.target.value = e.target.value.substring(0, start) + '    ' + e.target.value.substring(end);
                e.target.selectionStart = e.target.selectionEnd = start + 4;
            }
            if (e.ctrlKey && e.key === 'Enter') {
                runPlayground();
            }
        });

        // ============================================
        // QUIZ SYSTEM
        // ============================================
        function selectQuizAnswer(index) {
            if (quizAnswered) return;
            
            const lesson = courseData[currentLessonIndex];
            const options = document.querySelectorAll('.quiz-option-card');
            const resultBox = document.getElementById('quizResult');
            const isCorrect = index === lesson.quiz.correct;
            
            quizAnswered = true;
            
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === lesson.quiz.correct) {
                    opt.classList.add('correct');
                } else if (i === index && !isCorrect) {
                    opt.classList.add('wrong');
                }
            });
            
            resultBox.classList.add('show');
            
            if (isCorrect) {
                resultBox.classList.add('success');
                resultBox.innerHTML = '🎉 إجابة صحيحة! ممتاز، يمكنك الانتقال للدرس التالي.';
                createConfetti();
                markLessonComplete(currentLessonIndex);
            } else {
                resultBox.classList.add('error');
                resultBox.innerHTML = '❌ إجابة خاطئة. راجع الدرس وحاول مرة أخرى!';
            }
        }

        // ============================================
        // PROGRESS SYSTEM
        // ============================================
        function markLessonComplete(index) {
            if (!completedLessons.includes(index)) {
                completedLessons.push(index);
                localStorage.setItem('cssMasterProgress', JSON.stringify(completedLessons));
                updateSidebar();
                updateGlobalProgress();
            }
        }

        function updateSidebar() {
            document.querySelectorAll('.lesson-nav-btn').forEach((btn, i) => {
                const icon = btn.querySelector('.lesson-status-icon');
                btn.classList.remove('completed');
                
                if (completedLessons.includes(i)) {
                    btn.classList.add('completed');
                    icon.textContent = '✓';
                } else {
                    icon.textContent = '○';
                }
            });
        }

        function updateGlobalProgress() {
            const percent = Math.round((completedLessons.length / courseData.length) * 100);
            const bar = document.getElementById('globalProgress');
            const text = document.getElementById('globalProgressText');
            
            if (bar) bar.style.width = percent + '%';
            if (text) text.textContent = percent + '%';
        }

        function resetAllProgress() {
            if (confirm('هل أنت متأكد من حذف جميع بيانات التقدم؟')) {
                completedLessons = [];
                localStorage.removeItem('cssMasterProgress');
                updateSidebar();
                updateGlobalProgress();
                showToast('تم إعادة ضبط التقدم');
                loadLesson(0);
            }
        }

        // ============================================
        // NAVIGATION
        // ============================================
        function nextLesson() {
            if (currentLessonIndex < courseData.length - 1) {
                loadLesson(currentLessonIndex + 1);
            }
        }

        function prevLesson() {
            if (currentLessonIndex > 0) {
                loadLesson(currentLessonIndex - 1);
            }
        }

        function goHome() {
            loadLesson(0);
        }

        // ============================================
        // UTILITIES
        // ============================================
        function copyCode(btn) {
            const block = btn.closest('.code-block-wrapper').querySelector('.code-block');
            const text = block.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const original = btn.textContent;
                btn.textContent = '✓ تم!';
                setTimeout(() => btn.textContent = original, 2000);
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function createConfetti() {
            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#48bb78'];
            for (let i = 0; i < 60; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                piece.style.width = (Math.random() * 10 + 5) + 'px';
                piece.style.height = (Math.random() * 10 + 5) + 'px';
                piece.style.animation = `confettiFall ${Math.random() * 2 + 2}s ease-out forwards`;
                piece.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 4000);
            }
        }

        function triggerAnim() {
            const btn = document.querySelector('.trigger-btn');
            if (btn) {
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => btn.style.transform = '', 150);
            }
        }

        function toggleMobileMenu() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isOpen = sidebar.classList.contains('open');

            if (isOpen) {
                closeSidebar();
            } else {
                sidebar.classList.add('open');
                sidebar.style.display = 'block';
                if (overlay) overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            }
        }

        function closeSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('show');
            document.body.style.overflow = '';
            if (window.innerWidth <= 1024) {
                sidebar.style.display = 'none';
            }
        }

        window.addEventListener('resize', () => {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (window.innerWidth > 1024) {
                sidebar.style.display = '';
                sidebar.classList.remove('open');
                if (overlay) overlay.classList.remove('show');
                document.body.style.overflow = '';
            } else if (!sidebar.classList.contains('open')) {
                sidebar.style.display = 'none';
            }
        });

        // ============================================
        // START
        // ============================================
        init();
    </script>
</body>
</html>
