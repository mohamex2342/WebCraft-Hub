<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Pro - منصة تعليم HTML الاحترافية</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: var(--transition);
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: rotate(180deg);
            border-color: var(--primary);
        }

        /* Progress Bar */
        .progress-container {
            position: fixed;
            top: 70px;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--border);
            z-index: 999;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Layout */
        .container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 2rem 2rem;
        }

        /* Sidebar */
        .sidebar {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 100px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .level-section {
            margin-bottom: 1.5rem;
        }

        .level-header {
            font-weight: 700;
            padding: 0.75rem;
            background: var(--bg);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .lesson-item {
            padding: 0.75rem 1rem;
            margin: 0.25rem 0;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            color: var(--text);
        }

        .lesson-item:hover {
            background: var(--bg);
        }

        .lesson-item.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .lesson-item.completed {
            color: var(--success);
        }

        .lesson-status {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .lesson-item.completed .lesson-status {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .lesson-item.active .lesson-status {
            border-color: white;
        }

        /* Main Content */
        .main-content {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .lesson-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
        }

        .lesson-tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--primary);
            color: white;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .lesson-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .lesson-description {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .content-section {
            margin: 2rem 0;
        }

        .content-section h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .content-section h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 1.5rem 0 0.75rem;
        }

        .content-section p {
            margin-bottom: 1rem;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .code-block {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1.5rem;
            border-radius: var(--radius);
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 1rem 0;
            position: relative;
        }

        .code-block::before {
            content: 'HTML';
            position: absolute;
            top: 0;
            right: 0;
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-bottom-left-radius: 8px;
        }

        .code-block code {
            display: block;
        }

        .highlight {
            background: linear-gradient(120deg, rgba(99, 102, 241, 0.2) 0%, rgba(236, 72, 153, 0.2) 100%);
            padding: 0.1rem 0.3rem;
            border-radius: 4px;
            font-weight: 600;
        }

        /* Interactive Editor */
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 2rem 0;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .editor-panel {
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background: var(--bg);
            padding: 0.75rem 1rem;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .code-editor {
            flex: 1;
            min-height: 300px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            border: none;
            resize: none;
            background: var(--bg);
            color: var(--text);
            outline: none;
        }

        .preview-panel {
            background: white;
            border-right: 2px solid var(--border);
        }

        .preview-frame {
            width: 100%;
            height: 300px;
            border: none;
            background: white;
        }

        .editor-toolbar {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem;
            background: var(--bg);
            border-top: 1px solid var(--border);
        }

        .toolbar-btn {
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .toolbar-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Quiz Section */
        .quiz-container {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05), rgba(236, 72, 153, 0.05));
            border: 2px solid var(--primary);
            border-radius: var(--radius);
            padding: 2rem;
            margin: 2rem 0;
        }

        .quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quiz-question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .quiz-option {
            padding: 1rem 1.25rem;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1rem;
        }

        .quiz-option:hover {
            border-color: var(--primary);
            transform: translateX(-5px);
        }

        .quiz-option.selected {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .quiz-option.correct {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .quiz-option.wrong {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .quiz-result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: var(--radius);
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .quiz-result.show {
            display: block;
        }

        .quiz-result.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .quiz-result.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        /* Navigation */
        .lesson-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid var(--border);
        }

        /* Stats Dashboard */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            text-align: center;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                position: static;
                order: 2;
            }
            
            .editor-container {
                grid-template-columns: 1fr;
            }
            
            .preview-panel {
                border-right: none;
                border-top: 2px solid var(--border);
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 1rem;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .lesson-title {
                font-size: 1.5rem;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        /* Tooltip */
        .tooltip {
            position: relative;
        }

        .tooltip::after {
            content: attr(data-tip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.5rem;
            background: var(--text);
            color: var(--bg);
            font-size: 0.8rem;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .tooltip:hover::after {
            opacity: 1;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-beginner { background: #dbeafe; color: #1d4ed8; }
        .badge-intermediate { background: #fef3c7; color: #b45309; }
        .badge-advanced { background: #fce7f3; color: #be185d; }

        [data-theme="dark"] .badge-beginner { background: rgba(29, 78, 216, 0.3); }
        [data-theme="dark"] .badge-intermediate { background: rgba(180, 83, 9, 0.3); }
        [data-theme="dark"] .badge-advanced { background: rgba(190, 24, 93, 0.3); }

        /* Confetti Animation */
        @keyframes confetti {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: 100%;
            z-index: 9999;
            animation: confetti 3s ease-out forwards;
        }
    </style>

                content: `
                    <div class="lesson-header">

<code>&lt;!DOCTYPE html&gt;

        let currentLesson = 0;
        let completedLessons = JSON.parse(localStorage.getItem('htmlProProgress') || '[]');
        let quizAnswered = false;

        // Initialize
        function init() {
            const savedTheme = localStorage.getItem('htmlProTheme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            
            updateSidebar();
            loadLesson(0);
            updateProgress();
        }

        // Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            
            if (isDark) {
                html.removeAttribute('data-theme');
                localStorage.setItem('htmlProTheme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('htmlProTheme', 'dark');
            }
        }

        // Load Lesson
        function loadLesson(index) {
            currentLesson = index;
            const lesson = lessons[index];
            const mainContent = document.getElementById('mainContent');
            
            // Update sidebar active state
            document.querySelectorAll('.lesson-item').forEach((item, i) => {
                item.classList.remove('active');
                if (i === index) item.classList.add('active');
            });

            // Build content
            mainContent.innerHTML = lesson.content + `
                <div class="content-section">
                    <h2>💻 المحرر التفاعلي</h2>
                    <p>اكتب الكود في الجزء الأيسر وشاهد النتيجة مباشرة في الجزء الأيمن:</p>
                    
                    <div class="editor-container">
                        <div class="editor-panel preview-panel">
                            <div class="panel-header">
                                <span>👁️</span>
                                <span>المعاينة المباشرة</span>
                            </div>
                            <iframe class="preview-frame" id="previewFrame"></iframe>
                        </div>
                        <div class="editor-panel">
                            <div class="panel-header">
                                <span>✏️</span>
                                <span>محرر الكود</span>
                            </div>
                            <textarea class="code-editor" id="codeEditor" spellcheck="false">${lesson.defaultCode}</textarea>
                            <div class="editor-toolbar">
                                <button class="toolbar-btn" onclick="runCode()">▶️ تشغيل</button>
                                <button class="toolbar-btn" onclick="resetCode()">🔄 إعادة</button>
                                <button class="toolbar-btn" onclick="formatCode()">✨ تنسيق</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="quiz-container" id="quizContainer">
                    <div class="quiz-title">
                        <span>🧪</span>
                        <span>اختبار سريع</span>
                    </div>
                    <div class="quiz-question">${lesson.quiz.question}</div>
                    <div class="quiz-options" id="quizOptions">
                        ${lesson.quiz.options.map((opt, i) => `
                            <div class="quiz-option" onclick="selectAnswer(${i})">
                                <span>${String.fromCharCode(1616 + i)})</span>
                                <span>${opt}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="quiz-result" id="quizResult"></div>
                </div>

                <div class="lesson-nav">
                    <button class="btn btn-secondary" onclick="prevLesson()" ${index === 0 ? 'disabled style="opacity:0.5"' : ''}>
                        ← الدرس السابق
                    </button>
                    <button class="btn btn-primary" onclick="nextLesson()" ${index === lessons.length - 1 ? 'disabled style="opacity:0.5"' : ''}>
                        الدرس التالي →
                    </button>
                </div>
            `;

            quizAnswered = false;
            runCode();
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Code Editor Functions
        function runCode() {
            const code = document.getElementById('codeEditor').value;
            const frame = document.getElementById('previewFrame');
            const doc = frame.contentDocument || frame.contentWindow.document;
            
            doc.open();
            doc.write(code);
            doc.close();
        }

        function resetCode() {
            document.getElementById('codeEditor').value = lessons[currentLesson].defaultCode;
            runCode();
        }

        function formatCode() {
            const editor = document.getElementById('codeEditor');
            let code = editor.value;
            
            // Simple formatting
            code = code.replace(/></g, '>\n<<').replace(/}\s*{/g, '}\n{');
            editor.value = code;
            runCode();
        }

        // Quiz Functions
        function selectAnswer(index) {
            if (quizAnswered) return;
            
            const options = document.querySelectorAll('.quiz-option');
            const result = document.getElementById('quizResult');
            const isCorrect = index === lessons[currentLesson].quiz.correct;
            
            quizAnswered = true;
            
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === lessons[currentLesson].quiz.correct) {
                    opt.classList.add('correct');
                } else if (i === index && !isCorrect) {
                    opt.classList.add('wrong');
                }
            });
            
            result.classList.add('show');
            
            if (isCorrect) {
                result.classList.add('success');
                result.textContent = '🎉 إجابة صحيحة! أحسنت!';
                createConfetti();
                markLessonComplete(currentLesson);
            } else {
                result.classList.add('error');
                result.textContent = '❌ إجابة خاطئة. حاول مرة أخرى في المراجعة!';
            }
        }

        function markLessonComplete(index) {
            if (!completedLessons.includes(index)) {
                completedLessons.push(index);
                localStorage.setItem('htmlProProgress', JSON.stringify(completedLessons));
                updateSidebar();
                updateProgress();
            }
        }

        function updateSidebar() {
            document.querySelectorAll('.lesson-item').forEach((item, i) => {
                const status = item.querySelector('.lesson-status');
                if (completedLessons.includes(i)) {
                    item.classList.add('completed');
                    status.textContent = '✓';
                } else {
                    item.classList.remove('completed');
                    status.textContent = '○';
                }
            });
        }

        function updateProgress() {
            const percent = Math.round((completedLessons.length / lessons.length) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            
            const statElement = document.getElementById('currentProgress');
            if (statElement) statElement.textContent = percent + '%';
        }

        function nextLesson() {
            if (currentLesson < lessons.length - 1) {
                loadLesson(currentLesson + 1);
            }
        }

        function prevLesson() {
            if (currentLesson > 0) {
                loadLesson(currentLesson - 1);
            }
        }

        function resetProgress() {
            if (confirm('هل أنت متأكد من إعادة ضبط التقدم؟')) {
                completedLessons = [];
                localStorage.removeItem('htmlProProgress');
                updateSidebar();
                updateProgress();
                loadLesson(0);
            }
        }

        // Confetti Effect
        function createConfetti() {
            const colors = ['#6366f1', '#ec4899', '#10b981', '#f59e0b', '#3b82f6'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                runCode();
            }
        });

        // Initialize app
        init();
    </script>
</body>
</html>
